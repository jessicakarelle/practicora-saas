<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Confirmez votre compte Practicora</title>
  </head>
  <body style="margin:0;background:#f3f7fa;font-family:Arial,sans-serif;color:#172432">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7fa;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #d8e2ea;border-radius:20px;overflow:hidden">
            <tr><td style="padding:24px 28px;border-bottom:1px solid #e4ebf1;font-size:20px;font-weight:800;color:#1f4f75">Practicora</td></tr>
            <tr>
              <td style="padding:32px 28px">
                <h1 style="margin:0;font-size:26px;line-height:1.2">Confirmez votre adresse courriel</h1>
                <p style="margin:16px 0 0;line-height:1.7;color:#607182">Cette vérification active votre compte et protège la synchronisation de votre espace de stage.</p>
                <p style="margin:26px 0">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f6f9f;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:12px">Confirmer mon compte</a>
                </p>
                <p style="margin:0;line-height:1.7;color:#607182;font-size:14px">Si vous n’avez pas créé de compte Practicora, vous pouvez ignorer ce message.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
